<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ทดสอบความไว</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--idle:#12343b;--wait:#b8322a;--go:#6fd04a;--early:#38384f;--ink:#f4f7f2;--ink-dark:#10250a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--idle:#0c2227}}
:root[data-theme="dark"]{--idle:#0c2227}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:'Kanit','Noto Sans Thai',system-ui,sans-serif;background:var(--idle);color:var(--ink);overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
.screen{height:100%;display:none;flex-direction:column;padding:18px 22px 22px;background:var(--idle);transition:background .12s}
.screen.on{display:flex}
.screen.wait{background:var(--wait)}
.screen.go{background:var(--go);color:var(--ink-dark);transition:none}
.screen.early{background:var(--early)}
button{font:inherit;color:inherit;background:transparent;border:2px solid currentColor;border-radius:999px;padding:13px 22px;font-weight:500;font-size:18px;cursor:pointer}
button.pri{background:var(--go);border-color:var(--go);color:var(--ink-dark);font-weight:700}
button.sm{padding:6px 14px;font-size:14px;font-weight:300}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header{font-weight:300;font-size:15px;opacity:.9}
header b{font-weight:700;font-size:18px;display:block}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.big{font-size:clamp(60px,22vw,112px);font-weight:700;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.big small{font-size:.3em;font-weight:300;margin-left:6px}
.msg{font-size:22px;font-weight:500;margin:14px 0 0}
.sub{font-size:16px;font-weight:300;margin:6px 0 0;opacity:.88;min-height:24px}
.foot{text-align:center;font-weight:300;font-size:15px;min-height:48px}
.btns{display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.dots i{width:34px;height:6px;border-radius:3px;background:currentColor;opacity:.25}
.dots i.on{opacity:.95}
h1{font-size:44px;font-weight:700;margin:0;line-height:1.1}
.tag{font-weight:300;font-size:17px;margin:8px 0 0;opacity:.9}
input{font:inherit;width:100%;padding:12px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.2);color:var(--ink);font-size:18px;user-select:text;-webkit-user-select:text}
label{font-weight:300;font-size:15px;display:block;margin:0 0 6px}
#list{flex:1;overflow-y:auto;margin:14px 0;padding:0;list-style:none}
#list li{display:flex;gap:14px;align-items:baseline;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.15);font-size:18px}
#list li.me{background:rgba(111,208,74,.18);border-radius:10px;padding-left:10px}
#list .rk{width:30px;font-weight:700;font-variant-numeric:tabular-nums}
#list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .ms{font-weight:700;font-variant-numeric:tabular-nums}
#list li:nth-child(1) .rk{color:#ffd84a}
#duel{padding:0}
.half{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px}
.half.top .inner{transform:rotate(180deg)}
.half .big{font-size:clamp(52px,18vw,92px)}
.half .who{font-weight:300;font-size:16px;opacity:.9}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;background:rgba(0,0,0,.28);font-weight:500;font-size:18px}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <div class="row"><span></span><button class="sm" id="mute">เสียง: เปิด</button></div>
  <div class="mid" style="text-align:left">
    <h1>ทดสอบ<br>ความไว</h1>
    <p class="tag">รอสีเขียว แล้วแตะให้ไวที่สุด ใครไวกว่ากัน?</p>
    <div style="margin-top:26px"><label for="nick">ชื่อบนอันดับ</label><input id="nick" maxlength="12" placeholder="ใส่ชื่อเล่น" autocomplete="off"></div>
  </div>
  <div class="btns">
    <button class="pri" id="bSolo">เล่นเดี่ยว 5 รอบ ติดอันดับ</button>
    <button id="bDuel">แข่ง 2 คน เครื่องเดียว</button>
    <button id="bBoard">ดูอันดับ</button>
  </div>
</section>

<section id="solo" class="screen" role="button" tabindex="0">
  <div class="row"><header>รอบ<b id="rnd">1/5</b></header><header style="text-align:right">สถิติเฉลี่ยของคุณ<b id="pb">—</b></header></div>
  <div class="mid"><h2 class="big" id="sBig">ไว?</h2><p class="msg" id="sMsg">แตะเพื่อเริ่ม</p><p class="sub" id="sSub"></p></div>
  <div class="foot"><div class="dots" id="sDots"></div><div id="sFoot"></div>
    <div class="btns" id="sBtns" style="display:none;flex-direction:row;justify-content:center;flex-wrap:wrap"><button class="pri" id="again">เล่นอีกครั้ง</button><button id="toBoard">อันดับ</button><button id="home1">เมนู</button></div>
    <button class="sm" id="home0">ออก</button></div>
</section>

<section id="duel" class="screen">
  <div class="half top" id="h1"><div class="inner"><div class="who" id="w1"></div><h2 class="big" id="b1"></h2><p class="msg" id="m1"></p></div></div>
  <div class="bar"><span id="score">A 0 – 0 B</span><span><button class="sm" id="rematch" style="display:none">แข่งใหม่</button> <button class="sm" id="home2">เมนู</button></span></div>
  <div class="half bot" id="h0"><div class="inner"><div class="who" id="w0"></div><h2 class="big" id="b0"></h2><p class="msg" id="m0"></p></div></div>
</section>

<section id="board" class="screen">
  <div class="row"><h1 style="font-size:32px">อันดับ</h1><button class="sm" id="home3">กลับ</button></div>
  <p class="tag" id="bTag">เรียงตามค่าเฉลี่ย 5 รอบ ยิ่งน้อยยิ่งไว</p>
  <ul id="list"></ul>
</section>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var screens=['menu','solo','duel','board'];
function show(n){screens.forEach(function(s){$(s).className='screen'+(s===n?' on':'')});cur=n;}
var cur='menu';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}

/* ---------- sound ---------- */
var ac=null,muted=ls('rt_mute')==='1',drone=null,ticker=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type,v,f2,delay){if(muted)return;var a=audio();if(!a)return;var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,v){if(muted)return;var a=audio();if(!a)return;var n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(var i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);var s=a.createBufferSource(),g=a.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}
function buzz(p){try{if(navigator.vibrate&&!muted)navigator.vibrate(p)}catch(e){}}
function tenseOn(){tenseOff();if(muted)return;var a=audio();if(!a)return;var o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='sawtooth';o.frequency.value=55;f.type='lowpass';f.frequency.value=180;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+1.2);o.connect(f);f.connect(g);g.connect(a.destination);o.start();drone={o:o,a:a};ticker=setInterval(function(){tone(140,.1,'sine',.35,70)},520)}
function tenseOff(){clearInterval(ticker);if(drone){try{drone.o.stop(drone.a.currentTime+.02)}catch(e){}drone=null}}
function sGo(){tenseOff();tone(700,.25,'square',.22,1800);noise(.14,.3);buzz(40)}
function sFoul(){tenseOff();tone(260,.55,'sawtooth',.28,60);buzz([70,40,70])}
function sChime(ms){var b=ms<200?523:ms<300?440:349;[1,1.25,1.5].forEach(function(m,i){tone(b*m,.2,'triangle',.25,0,i*.09)})}
function sFanfare(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.22,'square',.17,0,i*.09)});tone(1047,.7,'triangle',.25,0,.5);buzz([50,30,50,30,120])}
function setMute(m){muted=m;ls('rt_mute',m?'1':'0');$('mute').textContent='เสียง: '+(m?'ปิด':'เปิด');if(m)tenseOff()}
$('mute').addEventListener('click',function(){setMute(!muted);if(!muted){audio();tone(660,.15,'triangle',.2)}});
setMute(muted);

/* ---------- leaderboard (Netlify function) ---------- */
var db=true,rows=[],boardNote='';
var myId=ls('rt_uid');
if(!myId){myId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('u'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));ls('rt_uid',myId)}
function loadBoard(){
  return fetch('/api/scores?me='+encodeURIComponent(myId)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    rows=(j.rows||[]).map(function(x){return{id:x.me?myId:'',name:String(x.name||'ไม่ระบุชื่อ'),best:Number(x.best)||0}});boardNote='';drawBoard();
  }).catch(function(){boardNote='โหลดอันดับไม่ได้ตอนนี้';drawBoard()});
}
function bindDb(){loadBoard();setInterval(function(){if(cur==='board')loadBoard()},8000)}
function drawBoard(){
  var ul=$('list');ul.innerHTML='';
  if(boardNote){var l=document.createElement('li');l.textContent=boardNote;ul.appendChild(l)}
  if(!rows.length&&!boardNote){var e=document.createElement('li');e.textContent='ยังไม่มีใครติดอันดับ เล่นเดี่ยวให้ครบ 5 รอบเพื่อเป็นคนแรก';ul.appendChild(e)}
  rows.forEach(function(r,i){var li=document.createElement('li');if(r.id)li.className='me';
    var a=document.createElement('span');a.className='rk';a.textContent=i+1;
    var b=document.createElement('span');b.className='nm';b.textContent=r.name;
    var c=document.createElement('span');c.className='ms';c.textContent=r.best+' ms';
    li.appendChild(a);li.appendChild(b);li.appendChild(c);ul.appendChild(li)});
}
function saveScore(avg){
  var name=($('nick').value||'').trim().slice(0,12)||'ไม่ระบุชื่อ';
  return fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:myId,name:name,best:avg})})
    .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return j&&j.rank?{rank:j.rank,total:j.total}:null}).catch(function(){return null});
}

/* ---------- solo ---------- */
var N=5,sst='idle',st=null,t0=0,rounds=[],pbAvg=parseInt(ls('rt_pbavg')||'',10)||null;
var sp=$('solo');
$('nick').value=ls('rt_nick')||'';
$('nick').addEventListener('input',function(){ls('rt_nick',$('nick').value)});
function sSet(cls,big,msg,sub){sp.className='screen on '+cls;$('sBig').innerHTML=big;$('sMsg').textContent=msg;$('sSub').textContent=sub||''}
function sDots(){var d=$('sDots');d.innerHTML='';for(var i=0;i<N;i++){var x=document.createElement('i');if(i<rounds.length)x.className='on';d.appendChild(x)}$('rnd').textContent=Math.min(rounds.length+1,N)+'/'+N;$('pb').textContent=pbAvg?pbAvg+' ms':'—'}
function ms(n){return n+'<small>ms</small>'}
function soloNew(){rounds=[];sst='idle';sp.className='screen on';$('sBtns').style.display='none';$('home0').style.display='';$('sFoot').textContent='';sSet('','ไว?','แตะเพื่อเริ่ม','ครบ 5 รอบ เพื่อดูอันดับ');sDots()}
function sStart(){
  sst='wait';sSet('wait','รอ…','อย่าเพิ่งแตะ','รอให้เป็นสีเขียว');$('sFoot').textContent='';tenseOn();
  st=setTimeout(function(){sst='go';t0=performance.now();sSet('go','แตะ!','','');sGo()},1500+Math.random()*3200);
}
function sPress(e){
  if(e.target.closest&&e.target.closest('button'))return;
  e.preventDefault();audio();
  if(sst==='idle'||sst==='result'||sst==='early'){sStart();return}
  if(sst==='wait'){clearTimeout(st);sst='early';sFoul();sSet('early','เร็วไป!','แตะก่อนสีเขียว','แตะเพื่อลองรอบนี้ใหม่');return}
  if(sst==='go'){
    var t=Math.round(performance.now()-t0);rounds.push(t);sDots();
    if(rounds.length>=N){finish();return}
    sst='result';sChime(t);sSet('',ms(t),'รอบที่ '+rounds.length+' เสร็จแล้ว','แตะเพื่อเล่นรอบต่อไป');
  }
}
function finish(){
  sst='summary';
  var avg=Math.round(rounds.reduce(function(a,c){return a+c},0)/N),best=Math.min.apply(null,rounds);
  var rec=!pbAvg||avg<pbAvg;if(rec){pbAvg=avg;ls('rt_pbavg',String(avg))}
  sDots();
  sSet('',ms(avg),rec?'สถิติใหม่ของคุณ!':'เฉลี่ย 5 รอบ','รอบที่ไวที่สุด '+best+' ms · '+rounds.join(', '));
  if(rec)sFanfare();else sChime(avg);
  $('sBtns').style.display='flex';$('home0').style.display='none';$('sFoot').textContent=db?'กำลังบันทึกอันดับ…':'';
  saveScore(avg).then(function(r){
    if(sst!=='summary')return;
    $('sFoot').textContent=r?'อันดับของคุณ '+r.rank+' จาก '+r.total+' คน':(db?'ส่งอันดับไม่สำเร็จ สถิติยังเก็บในเครื่องไว้ ลองใหม่ภายหลัง':'เล่นได้เต็มที่ สถิติเก็บในเครื่องแล้ว');
  });
}
sp.addEventListener('pointerdown',sPress);
function leaveSolo(){clearTimeout(st);tenseOff();sst='idle'}
$('again').addEventListener('click',soloNew);
$('home0').addEventListener('click',function(){leaveSolo();show('menu')});
$('home1').addEventListener('click',function(){leaveSolo();show('menu')});
$('toBoard').addEventListener('click',function(){leaveSolo();drawBoard();loadBoard();show('board')});
$('bSolo').addEventListener('click',function(){audio();show('solo');soloNew()});
$('bBoard').addEventListener('click',function(){drawBoard();loadBoard();show('board')});
$('home3').addEventListener('click',function(){show('menu')});

/* ---------- duel ---------- */
var dp=$('duel'),dst='idle',dt=null,dt0=0,sc=[0,0],TARGET=3,lock=0;
function dText(i,w,b,m){$('w'+i).textContent=w;$('b'+i).innerHTML=b;$('m'+i).textContent=m}
function dScore(){$('score').textContent='A '+sc[0]+' – '+sc[1]+' B'}
function dReset(){sc=[0,0];dst='idle';dp.className='screen on';$('rematch').style.display='none';dScore();
  dText(0,'ผู้เล่น A','ไว?','แตะเพื่อเริ่ม');dText(1,'ผู้เล่น B','ไว?','แตะเพื่อเริ่ม')}
function dStart(){
  dst='wait';dp.className='screen on wait';tenseOn();
  dText(0,'ผู้เล่น A','รอ…','อย่าแตะก่อน');dText(1,'ผู้เล่น B','รอ…','อย่าแตะก่อน');
  dt=setTimeout(function(){dst='go';dt0=performance.now();dp.className='screen on go';dText(0,'ผู้เล่น A','แตะ!','');dText(1,'ผู้เล่น B','แตะ!','');sGo()},1500+Math.random()*3200);
}
function dEnd(w,msg0,msg1,big0,big1){
  sc[w]++;dScore();dp.className='screen on';
  var over=sc[w]>=TARGET;
  if(over){dst='over';sFanfare();$('rematch').style.display='';
    dText(w,'ผู้เล่น '+(w?'B':'A'),'ชนะ!','ได้ '+TARGET+' แต้มก่อน');dText(1-w,'ผู้เล่น '+(w?'A':'B'),'แพ้','ลองแก้มือ')}
  else{dst='result';lock=Date.now()+700;dText(0,'ผู้เล่น A',big0,msg0);dText(1,'ผู้เล่น B',big1,msg1)}
}
function dPress(i,e){
  e.preventDefault();audio();
  if(dst==='idle'||(dst==='result'&&Date.now()>lock)){dStart();return}
  if(dst==='wait'){clearTimeout(dt);var w=1-i;sFoul();
    dEnd(w,i===0?'แตะก่อนเวลา!':'ได้แต้มจากคู่แข่งพลาด',i===1?'แตะก่อนเวลา!':'ได้แต้มจากคู่แข่งพลาด','','');
    if(dst==='result'){ $('b'+i).innerHTML='เร็วไป!';$('b'+w).innerHTML='+1'}
    return}
  if(dst==='go'){var t=Math.round(performance.now()-dt0);sChime(t);
    dEnd(i,'ไวกว่า '+(t)+' ms','แพ้รอบนี้','','');
    if(dst==='result'){$('b'+i).innerHTML=ms(t);$('b'+(1-i)).innerHTML='ช้ากว่า';$('m'+i).textContent='ชนะรอบนี้';$('m'+(1-i)).textContent='แตะเพื่อรอบต่อไป'}}
}
[0,1].forEach(function(i){$('h'+i).addEventListener('pointerdown',function(e){dPress(i,e)})});
function leaveDuel(){clearTimeout(dt);tenseOff();dst='idle'}
$('bDuel').addEventListener('click',function(){audio();show('duel');dReset()});
$('rematch').addEventListener('click',function(){dReset()});
$('home2').addEventListener('click',function(){leaveDuel();show('menu')});
bindDb();
})();
</script>
</body>
</html>
